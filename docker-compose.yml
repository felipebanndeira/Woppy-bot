version: "3.8"

networks:
  traefik-proxy:
    external: true
  internal-net:
    driver: bridge

volumes:
  pg_data:
  whatsapp_data:

services:
  # Base de datos PostgreSQL de producción
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-atiende_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atiende_password}
      POSTGRES_DB: ${DB_NAME:-atiende_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal-net

  # Proceso 1: Web (Next.js Dashboard, API, OAuth y Widget)
  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-tu-agencia/atiende}:latest
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && ([ \"$$SEED_DEMO\" = \"true\" ] && npx tsx src/scripts/seed.ts || true) && npm run start"]
    environment:
      - NODE_ENV=production
      - APP_URL=https://${SUBDOMAIN:-atiende}.${MAIN_DOMAIN:-tudominio.com}
      - DATABASE_URL=postgres://${DB_USER:-atiende_user}:${DB_PASSWORD:-atiende_password}@db:5432/${DB_NAME:-atiende_prod}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tuagencia.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-haiku-5.5}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://${SUBDOMAIN:-atiende}.${MAIN_DOMAIN:-tudominio.com}/api/integrations/google/callback
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
      - SEED_DEMO=${SEED_DEMO:-true}
    depends_on:
      - db
    networks:
      - internal-net
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME:-atiende}.rule=Host(`${SUBDOMAIN:-atiende}.${MAIN_DOMAIN:-tudominio.com}`)"
      - "traefik.http.routers.${PROJECT_NAME:-atiende}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME:-atiende}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${PROJECT_NAME:-atiende}.loadbalancer.server.port=3000"

  # Proceso 2: Worker de Node (WhatsApp Baileys + Tareas programadas)
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-tu-agencia/atiende}:latest
    restart: unless-stopped
    command: ["npx", "tsx", "src/worker/index.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER:-atiende_user}:${DB_PASSWORD:-atiende_password}@db:5432/${DB_NAME:-atiende_prod}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-haiku-5.5}
      - WHATSAPP_SESSION_DIR=/app/data/whatsapp_session
    volumes:
      - whatsapp_data:/app/data/whatsapp_session
    depends_on:
      - db
    networks:
      - internal-net
